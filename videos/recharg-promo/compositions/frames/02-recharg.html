    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        window.__timelines["02-recharg"] = tl;

        /* dynamic-content-sequencing (per-word variant): the word list + per-word
           timing config is reduced once at build time into absolute cues — no
           hardcoded DOM, no per-frame writes. */
        var BASE_GAP = 0.14; // s between short words
        var SEC_PER_CHAR = 0.018; // longer words earn slightly more runway
        var WORDS = ["La", "recarga,", "resuelta", "en", "tu", "cochera."];
        var cursor = 0.85; // Scene 2 opens as the VO enters the thesis
        var CUES = WORDS.map(function (w) {
          var start = cursor;
          cursor += BASE_GAP + w.length * SEC_PER_CHAR;
          return { text: w, start: start };
        });

        // Build the word spans once, synchronously
        var tagline = document.getElementById("rc02-tagline");
        var spans = CUES.map(function (cue, i) {
          var s = document.createElement("span");
          s.className = "rc02-word";
          s.textContent = cue.text;
          if (i === CUES.length - 1) {
            var bar = document.createElement("span");
            bar.className = "rc02-bar";
            bar.id = "rc02-bar";
            s.appendChild(bar);
          }
          tagline.appendChild(s);
          return s;
        });

        /* Scene 1 (0.0–0.8s) — lockup lands dead-center */
        // spring-pop-entrance: icon arrives scale 0 → 1, smooth power3 settle, no overshoot
        tl.fromTo(
          "#rc02-icon",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
          0.02
        );
        // one-shot magenta glow behind: plain opacity fade in, then out (never repeats)
        tl.fromTo(
          "#rc02-glow",
          { opacity: 0 },
          { opacity: 0.85, duration: 0.4, ease: "power2.out" },
          0.06
        );
        tl.to("#rc02-glow", { opacity: 0, duration: 0.75, ease: "power2.inOut" }, 0.72);
        // wordmark slides out from behind the icon under the overflow-hidden mask
        tl.fromTo(
          "#rc02-wordmark",
          { xPercent: -108 },
          { xPercent: 0, duration: 0.5, ease: "power3.out" },
          0.28
        );

        /* Scene 2 (0.8–2.2s) — tagline assembles per-word on the VO */
        spans.forEach(function (el, i) {
          tl.fromTo(
            el,
            { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
            CUES[i].start
          );
        });
        // on "cochera": thin magenta bar grows left → right under the word
        tl.fromTo(
          "#rc02-bar",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.4, ease: "power3.out" },
          2.05
        );

        /* Scene 3 (2.2–2.645s) — hold; nothing new enters */

      tl.to({}, { duration: 0.001 }, 3.144);
