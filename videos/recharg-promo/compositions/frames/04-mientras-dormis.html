  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["04-mientras-dormis"] = tl;

      /* Offset that puts the mark at dead frame center during the bloom:
         half of (wordmark width + gap) with the lockup row centered. */
      var MARK_CENTER_X = 272;

      /* ---- Scene 1 (0.0–1.5s): word-by-word quiet fade, grey -> white,
              synced under "Tu auto carga mientras dormís." (VO 0–1.71s).
              Flat opacity+color stagger — still register, no waterfall. ---- */
      var words = gsap.utils.toArray(".md4-word");
      var wordAt = [0.05, 0.3, 0.6, 0.92, 1.24];
      words.forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, color: "#50484d" },
          { opacity: 1, color: "#ffffff", duration: 0.3, ease: "power2.out" },
          wordAt[i]
        );
      });

      /* ---- Scene 2 (1.5–2.3s): text clears itself — shrink-toward-center
              + fade (scale-swap-transition, exit half)... ---- */
      tl.to(
        "#md4-tagline",
        { scale: 0.74, opacity: 0, duration: 0.26, ease: "power2.in" },
        1.52
      );

      /* ...and on the emptied frame the mark spring-BLOOMS from zero at dead
         center with slight rotation (spring-pop-entrance — the film's one
         permitted overshoot), timed to the "Hablemos" VO onset (~1.81s). */
      tl.fromTo(
        "#md4-mark",
        { scale: 0, opacity: 0, rotation: -10, x: MARK_CENTER_X },
        {
          scale: 1,
          opacity: 1,
          rotation: 0,
          duration: 0.46,
          ease: "back.out(1.6)",
        },
        1.7
      );

      /* Mark slides one step left while the wordmark reveals to its right
         with visible partial states (clip-path wipe). */
      tl.to(
        "#md4-mark",
        { x: 0, duration: 0.34, ease: "power2.inOut" },
        1.98
      );
      tl.fromTo(
        "#md4-wordmark",
        { clipPath: "inset(0% 100% 0% 0%)" },
        {
          clipPath: "inset(0% 0% 0% 0%)",
          duration: 0.34,
          ease: "power2.out",
        },
        1.98
      );

      /* ---- Scene 3 (~2.05s+): on the VO's "Hablemos", the magenta HABLEMOS
              pill spring-pops below the lockup (soft settle, no overshoot) —
              then everything holds dead-static to the last frame. ---- */
      tl.fromTo(
        "#md4-cta",
        { scale: 0, opacity: 0, y: 22 },
        { scale: 1, opacity: 1, y: 0, duration: 0.32, ease: "power3.out" },
        2.04
      );

      /* Deliberate hold: final frame of the film — dead static after ~2.36s. */
    
      /* hf-hold-pad: extiende el timeline hasta la duración del root (3.6s) para que el hold final sea estable en cualquier seek */
      tl.to({}, { duration: 0.001 }, 3.599);
    })();
