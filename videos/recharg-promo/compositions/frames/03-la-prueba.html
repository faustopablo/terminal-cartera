  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var EASE_SLOT = "power3.out";

      /* ---- macro camera: slow continuous push-in under the whole shot ---- */

        "#f03p-camera",
        { scale: 1, transformOrigin: "50% 43%" },
        { scale: 1.028, duration: 5.504, ease: "none" },
        0
      );

      /* ---- chrome fades in first ---- */

        "#f03p-chrome",
        { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        0.05
      );

      /* ---- center-outward-expansion (short-path direct-into-slot form) ----
         each card starts partially-spread (55% progress) and slides the
         remaining short distance into its slot, one per spoken cue */
      function cardIn(id, at) {
        var el = document.getElementById(id);
        var tx = Number(el.dataset.targetX);
        var ty = Number(el.dataset.targetY);
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: tx * 0.55, y: ty, scale: 0.94, opacity: 0 },
          { x: tx, y: ty, scale: 1, opacity: 1, duration: 0.8, ease: EASE_SLOT },
          at
        );
      }

      /* ===== Scene 1 (0.0–1.8s) — card 1: cargador mural ===== */
      cardIn("f03p-card1", 0.12);

      tl.fromTo(
        "#f03p-charger",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
        0.45
      );

      /* cable draw-in (svg-path-draw mechanics — measured, not hard-coded) */
      var cable = document.getElementById("f03p-cable");
      var cableLen = cable.getTotalLength();
      cable.style.strokeDasharray = cableLen;
      cable.style.strokeDashoffset = cableLen;
      tl.to(cable, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 0.65);
      tl.fromTo(
        "#f03p-connector",
        { opacity: 0 },
        { opacity: 1, duration: 0.25, ease: "power1.out" },
        1.25
      );

      /* screen + side button tick alive */
      tl.fromTo("#f03p-screenline", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.05);
      tl.fromTo("#f03p-sidebtn", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.15);

      /* label 1 */
      tl.fromTo("#f03p-rule1", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 0.95);
      tl.fromTo(
        "#f03p-label1",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        1.05
      );

      /* ===== Scene 2 (1.8–3.4s) — card 2: 7 · 11 · 22 kW ===== */
      cardIn("f03p-card2", 1.8);

      tl.fromTo(
        "#f03p-kwdim",
        { opacity: 0, x: -14 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" },
        2.05
      );
      tl.fromTo("#f03p-kwwrap", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 2.05);

      /* counting-dynamic-scale: value + scale share timing and ease */
      var counter = document.getElementById("f03p-counter");
      var state = { value: 0 };
      var COUNT_DUR = 1.0;
      var COUNT_EASE = "power3.out";
      tl.to(
        state,
        {
          value: 22,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: function () {
            counter.textContent = Math.round(state.value);
          },
        },
        2.1
      );
      tl.fromTo(counter, { scale: 0.55 }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, 2.1);

      /* suffix lands AFTER the count — its own beat */
      tl.fromTo(
        "#f03p-kwsuffix",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.7)" },
        3.12
      );

      /* label 2 (arrives before the count peaks) */
      tl.fromTo("#f03p-rule2", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 2.45);
      tl.fromTo(
        "#f03p-label2",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        2.55
      );

      /* ===== Scene 3 (3.4–4.8s) — card 3: app mock ===== */
      cardIn("f03p-card3", 3.4);

      tl.fromTo(
        "#f03p-apphead",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
        3.68
      );

      /* stat-bars-and-fills: scaleX from a left origin, staggered top→bottom */
      var rows = [
        { row: "#f03p-row1", fill: "#f03p-fill1", pct: 1.0, at: 3.78 },
        { row: "#f03p-row2", fill: "#f03p-fill2", pct: 0.62, at: 3.93 },
        { row: "#f03p-row3", fill: "#f03p-fill3", pct: 0.85, at: 4.08 },
      ];
      rows.forEach(function (r) {
        tl.fromTo(
          r.row,
          { opacity: 0, y: 6 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
          r.at - 0.06
        );
        tl.fromTo(
          r.fill,
          { scaleX: 0 },
          { scaleX: r.pct, duration: 0.7, ease: "power2.out" },
          r.at
        );
      });

      /* row values pop once their bars land */
      tl.fromTo("#f03p-val1", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 4.35);
      tl.fromTo("#f03p-val3", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 4.45);

      /* label 3 */
      tl.fromTo("#f03p-rule3", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 4.05);
      tl.fromTo(
        "#f03p-label3",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },

      );

      /* ===== Scene 4 (4.8–5.504s) — one flat glow pass behind the triptych ===== */
      tl.fromTo("#f03p-glow", { x: -620 }, { x: 2050, duration: 0.62, ease: "none" }, 4.85);
      tl.fromTo("#f03p-glow", { opacity: 0 }, { opacity: 0.45, duration: 0.25, ease: "none" }, 4.85);
      tl.to("#f03p-glow", { opacity: 0, duration: 0.3, ease: "none" }, 5.17);
      /* then everything holds still to the end */

      window.__timelines["03-la-prueba"] = tl;
    
      /* hf-hold-pad: extiende el timeline hasta la duración del root (6.004s) para que el hold final sea estable en cualquier seek */
      tl.to({}, { duration: 0.001 }, 6.002999999999999);
    })();
